name: Aplicar fondo y ajustar numeración

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Agregar fondo tecnológico del portafolio')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar fondo y numeración
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="assets/portfolio-background.css">'
          if link not in t:
              t=t.replace('</head>',link+'\n</head>',1)
          t=t.replace('<section class="wrap section" id="it"><div class="head"><span>05</span>','<section class="wrap section" id="it"><div class="head"><span>04</span>',1)
          t=t.replace('<section class="wrap section" id="tecnologias">\n<div class="head"><span>06</span>','<section class="wrap section" id="tecnologias">\n<div class="head"><span>05</span>',1)
          old='<section class="wrap section" id="cv-resumen" style="padding-top:24px">\n<div style="border:1px solid rgba(105,240,194,.28);'
          new='<section class="wrap section" id="cv-resumen" style="padding-top:24px"><div class="head" style="margin-bottom:20px"><span>06</span><div><h2>Currículum</h2><p>Una versión pública y protegida de mi experiencia, formación y proyectos.</p></div></div>\n<div style="border:1px solid rgba(105,240,194,.28);'
          if old in t:
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aplicar fondo tecnológico y ordenar secciones"
          git push
