name: Ocultar proyectos secundarios en portada

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Preparar portada con proyectos principales')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar secundarios de index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          start='<div style="margin:42px 0 18px;padding-top:28px;border-top:1px solid var(--line)">'
          end='<div class="actions" style="justify-content:center;margin-top:30px"><a class="btn primary" href="projects.html">Ver todos los proyectos →</a></div>'
          a=t.find(start)
          b=t.find(end,a)
          if a==-1 or b==-1:
              raise SystemExit('No se encontró el bloque secundario esperado')
          t=t[:a]+end+t[b+len(end):]
          p.write_text(t,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mostrar solo proyectos principales en portada"
          git push
