name: Unificar proyectos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-projects:
    if: contains(github.event.head_commit.message, 'Preparar unificación de proyectos')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unificar proyectos en la portada
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '<section class="wrap section" id="proyectos">'
          end_marker = '<section class="wrap section" id="it">'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('No se encontró el bloque de proyectos esperado')
          unified = '''<section class="wrap section" id="proyectos"><div class="head"><span>03</span><div><h2>Proyectos</h2><p>Aquí reúno los proyectos donde mejor puedo mostrar cómo pienso, cómo construyo soluciones y cómo las voy mejorando con pruebas, versiones y experiencia real.</p></div></div><div style="margin:0 0 18px"><div class="tag">Proyectos principales</div><h3 style="font-size:1.35rem;margin:6px 0 4px">Lo que estoy desarrollando y probando activamente</h3><p style="color:var(--muted);margin:0;max-width:820px">Estos son los proyectos que mejor representan mi trabajo actual en software, automatización y producto.</p></div><div class="projects"><article class="card"><div class="tag">Windows · BAT · PowerShell</div><h3>NovaOptimate JV Pro 2.0</h3><p>Estoy desarrollando un toolkit modular para diagnosticar, reparar y optimizar Windows de forma segura, con análisis de hardware y reglas de protección.</p><ul><li>Diagnóstico de sistema, discos, drivers, seguridad y red</li><li>Recomendaciones gaming basadas en hardware real</li><li>Reportes, respaldos y enfoque reversible</li></ul><div class="chips"><span class="chip ok">Beta activa</span><span class="chip warn">Demo privada 🔒</span><span class="chip">Código seleccionado</span></div><div class="cardActions"><a class="btn accent" href="projects/novaoptimate.html">Ver caso de estudio →</a><a class="btn ghost" href="projects/novaoptimate.html#codigo">Ver código →</a></div></article><article class="card"><div class="tag">React · TypeScript · PWA · Cloudflare</div><h3>Mi Libreta Financiera</h3><p>Estoy desarrollando esta aplicación para personas que quieren controlar su dinero sin usar una hoja de cálculo ni conectar sus cuentas bancarias.</p><ul><li>Hasta 12 libretas independientes y comparador</li><li>Pagos, objetivos, apartados, respaldos y tutorial</li><li>IndexedDB local + D1/Drizzle para servicios mínimos</li></ul><div class="chips"><span class="chip ok">Beta activa</span><span class="chip warn">Demo privada 🔒</span><span class="chip">Código seleccionado</span></div><div class="cardActions"><a class="btn accent" href="projects/libreta-financiera.html">Ver caso de estudio →</a><a class="btn ghost" href="projects/libreta-financiera.html#codigo">Ver código →</a></div></article><article class="card"><div class="tag">HTML · CSS · JavaScript · Gaming</div><h3>NOVA Warframe Builder</h3><p>Construí un builder offline bilingüe para Warframe con presets, filtros, edición local y una base preparada para sincronizar datos externos.</p><ul><li>Español / English y nombres duales</li><li>Builds, Mods, Arcanos, Helminth y Fragmentos</li><li>Evolución documentada de v1.0 a v1.9</li></ul><div class="chips"><span class="chip warn">En desarrollo</span><span class="chip warn">Demo privada 🔒</span><span class="chip">Código seleccionado</span></div><div class="cardActions"><a class="btn accent" href="projects/warframe-builder.html">Ver caso de estudio →</a><a class="btn ghost" href="projects/warframe-builder.html#codigo">Ver código →</a></div></article><article class="card"><div class="tag">BAT · PowerShell · IT Automation</div><h3>Laboratorio de Automatización IT</h3><p>Aquí reúno scripts que he creado para inventario, diagnóstico, reportes, reparación y análisis de equipos Windows.</p><ul><li>Información de hardware y componentes con CIM</li><li>Detección de instalaciones y librerías</li><li>Rutinas de diagnóstico y mantenimiento</li></ul><div class="chips"><span class="chip warn">En desarrollo continuo</span><span class="chip warn">Demo privada 🔒</span><span class="chip">Código seleccionado</span></div><div class="cardActions"><a class="btn accent" href="projects/automation-lab.html">Ver caso de estudio →</a><a class="btn ghost" href="projects/automation-lab.html#codigo">Ver código →</a></div></article></div><div style="margin:42px 0 18px;padding-top:28px;border-top:1px solid var(--line)"><div class="tag">En desarrollo y experiencia complementaria</div><h3 style="font-size:1.35rem;margin:6px 0 4px">Otros trabajos que amplían mi perfil</h3><p style="color:var(--muted);margin:0;max-width:820px">Aquí incluyo proyectos que estoy construyendo y trabajo aplicado que muestra otras partes de mi experiencia.</p></div><div class="projects"><article class="card"><div class="tag">Accesibilidad · Asistencia guiada · Familia</div><h3>LUZ</h3><p>Estoy desarrollando una aplicación para simplificar actividades cotidianas de una persona mayor mediante instrucciones claras, botones grandes, fotografías reales y apoyo de familiares responsables.</p><ul><li>Rutinas e instrucciones paso a paso</li><li>Contacto familiar por mensaje, llamada y WhatsApp</li><li>Configuración administrada por responsables</li></ul><div class="chips"><span class="chip warn">En desarrollo</span><span class="chip">Diseño centrado en accesibilidad</span></div><div class="cardActions"><a class="btn accent" href="projects/luz-asistente.html">Ver proyecto →</a></div></article><article class="card"><div class="tag">Producto digital · Bilingüe</div><h3>Vínculo 180</h3><p>Construí este producto para parejas con experiencia offline, 180 cartas bilingües, 52 retos y un diario guiado. La prueba comercial me dejó aprendizaje real sobre producto, UX y validación.</p><div class="chips"><span class="chip warn">En desarrollo</span><span class="chip ok">Código de base disponible</span><span class="chip warn">Demo privada 🔒</span></div><div class="cardActions"><a class="btn accent" href="projects/vinculo-180.html">Ver caso de estudio →</a><a class="btn ghost" href="projects/vinculo-180.html#codigo">Ver código →</a></div></article><article class="card"><div class="tag">Service Desk · Troubleshooting</div><h3>IT Support & Case Studies</h3><p>Aquí documento mi experiencia de soporte de forma anonimizada: diagnóstico, resolución, seguimiento y aprendizaje sin exponer información empresarial.</p><div class="chips"><span class="chip ok">Experiencia profesional</span><span class="chip">Datos protegidos</span></div><div class="cardActions"><a class="btn accent" href="projects/it-support.html">Ver experiencia →</a></div></article></div><div class="actions" style="justify-content:center;margin-top:30px"><a class="btn primary" href="projects.html">Ver todos los proyectos →</a></div></section>'''
          text = text[:start] + unified + text[end:]
          path.write_text(text, encoding='utf-8')
      - name: Publicar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unificar proyectos y mostrar estados"
          git push
