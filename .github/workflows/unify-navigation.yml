name: Unificar navegación

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Ejecutar navegación unificada')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar navegación
        run: python scripts/unify_nav.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html perfil.html experiencia.html projects.html tecnologias.html cv.html projects/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Unificar navegación superior en todo el portafolio"
          git push
